# Render Blueprint: the G-AI FastAPI backend (apps/backend) as a Docker web service.
# The database is external (Supabase PostgreSQL). Setup steps: docs/deploy-render.md.
services:
  - type: web
    name: g-ai-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: apps/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    # Redeploy only when the backend changes (the frontends deploy on Vercel).
    buildFilter:
      paths:
        - apps/backend/**
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: BACKEND_CORS_ORIGINS
        value: https://g-ai-app.vercel.app,https://g-ai-site.vercel.app
      - key: SECRET_KEY
        generateValue: true
      # Supabase connection string (Session pooler, port 5432) with the
      # postgresql+asyncpg:// prefix. You paste it in the Render dashboard; it is never committed.
      - key: DATABASE_URL
        sync: false
