name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Migrations match models
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_migrations.db
        run: |
          alembic upgrade head
          alembic check

  web:
    # npm workspaces: packages/ui is shared by both sites, so install from the repo root.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [hub, site, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/${{ matrix.app }}
        run: npm run typecheck
      - name: Lint
        working-directory: apps/${{ matrix.app }}
        run: npm run lint
      - name: Test
        working-directory: apps/${{ matrix.app }}
        run: npm test --if-present
      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: npm run build
