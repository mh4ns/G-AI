name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Migrations match models
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_migrations.db
        run: |
          alembic upgrade head
          alembic check

  web:
    # npm workspaces: packages/ui is shared by both sites, so install from the repo root.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [hub, site, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/${{ matrix.app }}
        run: npm run typecheck
      - name: Lint
        working-directory: apps/${{ matrix.app }}
        run: npm run lint
      - name: Test
        working-directory: apps/${{ matrix.app }}
        run: npm test --if-present
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/${{ matrix.app }}/.next/cache
          key: nextjs-${{ matrix.app }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles(format('apps/{0}/src/**', matrix.app), 'packages/ui/src/**') }}
          restore-keys: |
            nextjs-${{ matrix.app }}-${{ hashFiles('package-lock.json') }}-
      - name: Build
        working-directory: apps/${{ matrix.app }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      # The e2e job reuses this build. It was made with the default localhost URLs
      # (no NEXT_PUBLIC_* / BACKEND_URL set), which is exactly what the e2e servers use.
      - name: Upload build for e2e
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/.next
            !apps/${{ matrix.app }}/.next/cache
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  e2e:
    # Playwright across hub, site, app and the FastAPI backend (SQLite), see e2e/playwright.config.ts.
    needs: [backend, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: pip install -r apps/backend/requirements.txt
      # Each artifact holds the contents of one app's .next directory.
      - name: Download hub build
        uses: actions/download-artifact@v4
        with:
          name: next-build-hub
          path: apps/hub/.next
      - name: Download site build
        uses: actions/download-artifact@v4
        with:
          name: next-build-site
          path: apps/site/.next
      - name: Download app build
        uses: actions/download-artifact@v4
        with:
          name: next-build-web
          path: apps/web/.next
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run e2e tests
        env:
          E2E_SKIP_BUILD: "1"
          E2E_PYTHON: python
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
