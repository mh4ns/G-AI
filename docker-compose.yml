# Local full stack: PostgreSQL + FastAPI + hub/site/app (Next.js).
# Secrets are read from a root .env file (copy .env.example). Compose refuses to start without them.
#   docker compose up --build
#   hub http://localhost:3002 · site http://localhost:3001 · app http://localhost:3000 · API http://localhost:8000
services:
  backend:
    build:
      context: ./apps/backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-g_ai_db}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      AUTO_CREATE_SCHEMA: "false"
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      db:
        condition: service_healthy

  web:
    # Coaching app: quiz, prediction, Today, login
    build:
      context: .
      dockerfile: docker/next-app.Dockerfile
      args:
        APP: web
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PREDICTION_SIGNING_SECRET: ${PREDICTION_SIGNING_SECRET:?set PREDICTION_SIGNING_SECRET in .env}
    depends_on:
      - backend

  site:
    # Brand site: landing page and Movement Goods store
    build:
      context: .
      dockerfile: docker/next-app.Dockerfile
      args:
        APP: site
    ports:
      - "3001:3001"

  hub:
    # Main website: links to every product site
    build:
      context: .
      dockerfile: docker/next-app.Dockerfile
      args:
        APP: hub
    ports:
      - "3002:3002"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-g_ai_db}
    # Not published to the host; only the backend talks to the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
